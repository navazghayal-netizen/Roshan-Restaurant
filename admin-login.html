<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Roshan Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overflow-x: hidden; }
        .focus-ring:focus { outline: 3px solid rgba(245,158,11,0.25); outline-offset: 2px; }
        .auth-btn {
            min-height: 46px;
            border-radius: 999px;
            font-weight: 700;
            box-shadow: 0 10px 18px rgba(15, 23, 42, 0.12);
            transition: transform 160ms ease, box-shadow 160ms ease;
        }
        .auth-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(15, 23, 42, 0.18);
        }
        .auth-input {
            width: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 1rem;
        }
        .auth-input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .restricted-badge {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            display: inline-block;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md">
            <!-- Header -->
            <div class="text-center mb-8">
                <a href="index.html" class="inline-block mb-4">
                    <div class="w-14 h-14 rounded-full bg-yellow-500 flex items-center justify-center text-white text-2xl font-bold shadow">R</div>
                </a>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Roshan Restaurant</h1>
                <p class="text-gray-600 flex items-center justify-center gap-2">
                    Admin Login
                    <span class="restricted-badge">RESTRICTED</span>
                </p>
            </div>

            <!-- Admin Login Form -->
            <form id="adminLoginForm" class="bg-white rounded-2xl shadow-lg p-8 space-y-5">
                <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-4">
                    <p class="text-sm text-red-800">
                        <strong>Admin Access Only</strong><br>
                        Only authorized administrators can access this panel.
                    </p>
                </div>

                <div>
                    <label for="mobile" class="block text-sm font-semibold text-gray-700 mb-2">Mobile Number *</label>
                    <input id="mobile" type="tel" pattern="[0-9]{10}" placeholder="10-digit mobile number" class="auth-input" required />
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password *</label>
                    <input id="password" type="password" placeholder="Enter admin password" class="auth-input" required />
                </div>

                <button type="submit" class="w-full auth-btn bg-gradient-to-r from-red-600 to-red-700 text-white hover:from-red-700 hover:to-red-800 focus-ring">
                    Admin Login
                </button>

                <div class="text-center">
                    <p class="text-gray-600 text-sm">Not an admin? 
                        <a href="index.html" class="text-yellow-600 font-bold hover:text-yellow-700">Back to home</a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <script>
        const form = document.getElementById('adminLoginForm');
        const toastEl = document.getElementById('toast');

        function showToast(message, type = 'success') {
            toastEl.className = `toast ${type}`;
            toastEl.textContent = message;
            setTimeout(() => { toastEl.className = ''; }, 3000);
        }

        // Initialize admin user on first load
        function initializeAdminUser() {
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (!users['admin@roshan.com']) {
                users['admin@roshan.com'] = {
                    mobile: '9978349653',
                    email: 'admin@roshan.com',
                    password: btoa('roshan321'),
                    createdAt: new Date().toISOString(),
                    isAdmin: true
                };
                localStorage.setItem('users', JSON.stringify(users));
            }
        }

        initializeAdminUser();

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const mobile = document.getElementById('mobile').value.trim();
            const password = document.getElementById('password').value;

            // Check against admin credentials
            const adminMobile = '9978349653';
            const adminPassword = 'roshan321';

            if (mobile !== adminMobile || password !== adminPassword) {
                showToast('Invalid mobile number or password', 'error');
                return;
            }

            // Set as admin
            localStorage.setItem('currentUser', JSON.stringify({
                mobile: adminMobile,
                email: 'admin@roshan.com',
                isAdmin: true
            }));

            showToast('Admin login successful! Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = 'admin.html';
            }, 1500);
        });
    </script>
</body>
</html>
