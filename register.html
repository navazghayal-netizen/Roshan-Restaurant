<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Roshan Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overflow-x: hidden; }
        .focus-ring:focus { outline: 3px solid rgba(245,158,11,0.25); outline-offset: 2px; }
        .auth-btn {
            min-height: 46px;
            border-radius: 999px;
            font-weight: 700;
            box-shadow: 0 10px 18px rgba(15, 23, 42, 0.12);
            transition: transform 160ms ease, box-shadow 160ms ease;
        }
        .auth-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(15, 23, 42, 0.18);
        }
        .auth-input {
            width: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 1rem;
        }
        .auth-input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md">
            <!-- Header -->
            <div class="text-center mb-8">
                <a href="index.html" class="inline-block mb-4">
                    <div class="w-14 h-14 rounded-full bg-yellow-500 flex items-center justify-center text-white text-2xl font-bold shadow">R</div>
                </a>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Roshan Restaurant</h1>
                <p class="text-gray-600">Create your account to order now</p>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" class="bg-white rounded-2xl shadow-lg p-8 space-y-5">
                <div>
                    <label for="mobile" class="block text-sm font-semibold text-gray-700 mb-2">Mobile Number *</label>
                    <input id="mobile" type="tel" pattern="[0-9]{10}" placeholder="10-digit mobile number" class="auth-input" required />
                    <p class="text-xs text-gray-500 mt-1">Format: 10 digits (e.g., 9978349653)</p>
                </div>

                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email Address *</label>
                    <input id="email" type="email" placeholder="your@email.com" class="auth-input" required />
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password *</label>
                    <input id="password" type="password" placeholder="At least 6 characters" class="auth-input" minlength="6" required />
                </div>

                <div>
                    <label for="confirmPassword" class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password *</label>
                    <input id="confirmPassword" type="password" placeholder="Confirm your password" class="auth-input" minlength="6" required />
                </div>

                <button type="submit" class="w-full auth-btn bg-gradient-to-r from-yellow-500 to-yellow-600 text-white hover:from-yellow-600 hover:to-yellow-700 focus-ring">
                    Create Account
                </button>

                <div class="text-center">
                    <p class="text-gray-600 text-sm">Already have an account? 
                        <a href="login.html" class="text-yellow-600 font-bold hover:text-yellow-700">Sign in</a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <script>
        const form = document.getElementById('registerForm');
        const toastEl = document.getElementById('toast');

        function showToast(message, type = 'success') {
            toastEl.className = `toast ${type}`;
            toastEl.textContent = message;
            setTimeout(() => { toastEl.className = ''; }, 3000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (mobile.length !== 10 || !/^\d{10}$/.test(mobile)) {
                showToast('Mobile number must be exactly 10 digits', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showToast('Passwords do not match', 'error');
                return;
            }

            if (password.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                return;
            }

            // Check if email already exists
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[email]) {
                showToast('Email already registered', 'error');
                return;
            }

            // Save user
            users[email] = {
                mobile,
                email,
                password: btoa(password), // Simple encoding (not secure for production)
                createdAt: new Date().toISOString(),
                isAdmin: false
            };

            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify({ email, mobile, isAdmin: false }));

            showToast('Account created successfully! Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });
    </script>
</body>
</html>
