<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Roshan Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overflow-x: hidden; }
        .focus-ring:focus { outline: 3px solid rgba(245,158,11,0.25); outline-offset: 2px; }
        .auth-btn {
            min-height: 46px;
            border-radius: 999px;
            font-weight: 700;
            box-shadow: 0 10px 18px rgba(15, 23, 42, 0.12);
            transition: transform 160ms ease, box-shadow 160ms ease;
        }
        .auth-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(15, 23, 42, 0.18);
        }
        .auth-input {
            width: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 1rem;
        }
        .auth-input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
        .toast.info { background: #2563eb; }
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md">
            <!-- Header -->
            <div class="text-center mb-8">
                <a href="index.html" class="inline-block mb-4">
                    <div class="w-14 h-14 rounded-full bg-yellow-500 flex items-center justify-center text-white text-2xl font-bold shadow">R</div>
                </a>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Roshan Restaurant</h1>
                <p class="text-gray-600">Sign in to your account</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="bg-white rounded-2xl shadow-lg p-8 space-y-5">
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email Address *</label>
                    <input id="email" type="email" placeholder="your@email.com" class="auth-input" required />
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password *</label>
                    <input id="password" type="password" placeholder="Enter your password" class="auth-input" required />
                </div>

                <button type="submit" class="w-full auth-btn bg-gradient-to-r from-yellow-500 to-yellow-600 text-white hover:from-yellow-600 hover:to-yellow-700 focus-ring">
                    Sign In
                </button>

                <div class="flex items-center gap-3">
                    <button type="button" id="forgotPasswordBtn" class="flex-1 auth-btn bg-gray-200 text-gray-800 hover:bg-gray-300">
                        Forgot Password?
                    </button>
                </div>

                <div class="text-center">
                    <p class="text-gray-600 text-sm">Don't have an account? 
                        <a href="register.html" class="text-yellow-600 font-bold hover:text-yellow-700">Create one</a>
                    </p>
                </div>
            </form>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" class="bg-white rounded-2xl shadow-lg p-8 space-y-5 hidden">
                <h2 class="text-2xl font-bold text-gray-900 mb-4">Reset Password</h2>
                
                <div id="step1ForgotPassword" class="space-y-5">
                    <div>
                        <label for="forgotEmail" class="block text-sm font-semibold text-gray-700 mb-2">Email Address *</label>
                        <input id="forgotEmail" type="email" placeholder="your@email.com" class="auth-input" required />
                    </div>
                    <button type="button" id="sendOtpBtn" class="w-full auth-btn bg-gradient-to-r from-blue-500 to-blue-600 text-white hover:from-blue-600 hover:to-blue-700 focus-ring">
                        Send OTP
                    </button>
                </div>

                <div id="step2VerifyOtp" class="space-y-5 hidden">
                    <p class="text-gray-600 text-sm">Enter the OTP sent to your email</p>
                    <div>
                        <label for="otp" class="block text-sm font-semibold text-gray-700 mb-2">OTP Code *</label>
                        <input id="otp" type="text" placeholder="6-digit OTP" class="auth-input text-center text-lg tracking-widest" maxlength="6" required />
                    </div>
                    <button type="button" id="verifyOtpBtn" class="w-full auth-btn bg-gradient-to-r from-green-500 to-green-600 text-white hover:from-green-600 hover:to-green-700 focus-ring">
                        Verify OTP
                    </button>
                </div>

                <div id="step3NewPassword" class="space-y-5 hidden">
                    <div>
                        <label for="newPassword" class="block text-sm font-semibold text-gray-700 mb-2">New Password *</label>
                        <input id="newPassword" type="password" placeholder="At least 6 characters" class="auth-input" minlength="6" required />
                    </div>
                    <div>
                        <label for="confirmNewPassword" class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password *</label>
                        <input id="confirmNewPassword" type="password" placeholder="Confirm password" class="auth-input" minlength="6" required />
                    </div>
                    <button type="button" id="resetPasswordBtn" class="w-full auth-btn bg-gradient-to-r from-purple-500 to-purple-600 text-white hover:from-purple-600 hover:to-purple-700 focus-ring">
                        Reset Password
                    </button>
                </div>

                <button type="button" id="backToLoginBtn" class="w-full auth-btn bg-gray-200 text-gray-800 hover:bg-gray-300">
                    Back to Login
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
        const backToLoginBtn = document.getElementById('backToLoginBtn');
        const toastEl = document.getElementById('toast');

        let currentOtp = null;
        let resetEmail = null;

        function showToast(message, type = 'success') {
            toastEl.className = `toast ${type}`;
            toastEl.textContent = message;
            setTimeout(() => { toastEl.className = ''; }, 3000);
        }

        function toggleForms() {
            loginForm.classList.toggle('hidden');
            forgotPasswordForm.classList.toggle('hidden');
        }

        // Login Handler
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const users = JSON.parse(localStorage.getItem('users') || '{}');
            const user = users[email];

            if (!user || atob(user.password) !== password) {
                showToast('Invalid email or password', 'error');
                return;
            }

            localStorage.setItem('currentUser', JSON.stringify({
                email: user.email,
                mobile: user.mobile,
                isAdmin: user.isAdmin || false
            }));

            showToast('Login successful! Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });

        // Forgot Password Button
        forgotPasswordBtn.addEventListener('click', (e) => {
            e.preventDefault();
            toggleForms();
        });

        backToLoginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            toggleForms();
            document.getElementById('step1ForgotPassword').classList.remove('hidden');
            document.getElementById('step2VerifyOtp').classList.add('hidden');
            document.getElementById('step3NewPassword').classList.add('hidden');
        });

        // Send OTP
        document.getElementById('sendOtpBtn').addEventListener('click', (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const users = JSON.parse(localStorage.getItem('users') || '{}');

            if (!users[email]) {
                showToast('Email not found', 'error');
                return;
            }

            resetEmail = email;
            currentOtp = Math.floor(100000 + Math.random() * 900000).toString();
            localStorage.setItem(`otp_${email}`, currentOtp);
            localStorage.setItem(`otp_time_${email}`, Date.now());

            // In production, this would send via email
            // For demo, show OTP in console
            console.log(`OTP for ${email}: ${currentOtp}`);
            showToast(`OTP sent to ${email}. Check console for demo OTP.`, 'info');

            document.getElementById('step1ForgotPassword').classList.add('hidden');
            document.getElementById('step2VerifyOtp').classList.remove('hidden');
        });

        // Verify OTP
        document.getElementById('verifyOtpBtn').addEventListener('click', (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value;
            const storedOtp = localStorage.getItem(`otp_${resetEmail}`);
            const otpTime = parseInt(localStorage.getItem(`otp_time_${resetEmail}`) || 0);

            // OTP valid for 10 minutes
            if (Date.now() - otpTime > 600000) {
                showToast('OTP expired', 'error');
                return;
            }

            if (otp !== storedOtp) {
                showToast('Invalid OTP', 'error');
                return;
            }

            showToast('OTP verified successfully', 'success');
            document.getElementById('step2VerifyOtp').classList.add('hidden');
            document.getElementById('step3NewPassword').classList.remove('hidden');
        });

        // Reset Password
        document.getElementById('resetPasswordBtn').addEventListener('click', (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmNewPassword) {
                showToast('Passwords do not match', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '{}');
            users[resetEmail].password = btoa(newPassword);
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.removeItem(`otp_${resetEmail}`);
            localStorage.removeItem(`otp_time_${resetEmail}`);

            showToast('Password reset successfully! Logging in...', 'success');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });
    </script>
</body>
</html>
